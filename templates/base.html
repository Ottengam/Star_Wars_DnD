<!DOCTYPE html>
{% load static %}
<html lang="ru" translate="no">
<head>
    <!-- Системные метаданные и параметры масштабирования -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Мета-заголовок документа базы данных по умолчанию -->
    <title>{% block title %}Квидухаб.GAMES | Справочник{% endblock %}</title>

    <!-- Подключение глобального ядра стилей -->
    <link rel="stylesheet" href="{% static 'css/global.css' %}">

    <!-- Слот для подключения локальных модулей стилей конкретных страниц -->
    {% block page_css %}{% endblock %}
</head>
<body>
    <!-- Глобальная навигационная панель интерфейса -->
    <nav class="navbar">
        <div class="navbar-container">
            <!-- Системный логотип и корневой якорь базы данных -->
            <a href="/" class="nav-logo">Квидухаб.GAMES</a>

            <!-- Интерфейсный триггер состояния мобильного меню -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle-checkbox" aria-hidden="true">

            <!-- Графический маркер управления интерфейсным триггером -->
            <label for="menu-toggle" class="menu-hamburger">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </label>

            <!-- Контейнер навигационных узлов интерфейса -->
            <div class="nav-menu">
                <a href="#" class="nav-link">Главная</a>
                <a href="{% url 'wiki:race_list' %}" class="nav-link {% if 'race' in request.resolver_match.url_name %}active{% endif %}">Расы</a>
                <a href="#" class="nav-link">Классы</a>
                <a href="#" class="nav-link">Сила</a>
                <a href="#" class="nav-link">Снаряжение</a>
                <a href="#" class="nav-link">Планеты</a>
                <a href="#" class="nav-link">Техника</a>
            </div>
        </div>
    </nav>

    <!-- Основной контентный фрейм документа -->
    <main class="main-container">
        <!-- Слот для динамического контента Django-шаблонов -->
        {% block content %}{% endblock %}
    </main>
</body>
</html>
